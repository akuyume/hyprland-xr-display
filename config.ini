# Flat, mono 3DoF original XREAL Air. Degrees unless stated otherwise.
target_output_make=Nreal
target_output_model=Air
target_output_name_override=
virtual_output_name=XR-VIRTUAL
virtual_resolution=1920x1080
virtual_refresh_rate=60
virtual_scale=1
# Distance in meters; display_size is horizontal angular width in degrees.
# With 3DoF, changing distance at a fixed angular width has no visual effect.
display_distance=2
display_size=32
horizontal_fov=40
vertical_fov=23
yaw_offset=0
pitch_offset=0
roll_enabled=true
invert_yaw=false
invert_pitch=false
invert_roll=false
capture_backend=auto
render_refresh_rate=60
pose_timeout_ms=250
pose_path=/dev/shm/breezy_desktop_imu
# GPU used for capture allocation; override on multi-GPU systems.
drm_device=/dev/dri/renderD128

# Supported driver external output without Breezy productivity requirement.
pose_backend=opentrack
opentrack_port=4242
